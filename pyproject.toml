[project]
name = "trading-ml"
version = "0.1.0"
description = "ML + trading research lab on NautilusTrader with Alpaca data"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus_trader==1.227.0",
    "alpaca-py==0.43.4",
    "pandas>=2.2",
    "polars>=1.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "quantstats>=0.0.62",
    "scipy>=1.13",
    "lightgbm>=4.5",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "torch>=2.2",
    "transformers>=4.40",
    "vadersentiment>=3.3.2",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.24",
]

# Pin torch to the CPU-only wheel — the default wheel pulls ~3GB of nvidia
# CUDA libraries even on CPU-only systems, and there's no GPU available
# here. FinBERT inference on CPU is fast enough for the project's scale
# (~30k headlines in ~5 min).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
